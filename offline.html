<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>لا يوجد اتصال — First 1 Car</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#f1f5f9;background:linear-gradient(135deg,#020617,#0f172a);font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}
.box{max-width:380px}
.ic{width:104px;height:104px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;font-size:50px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4)}
h1{font-size:24px;font-weight:900;margin-bottom:8px}
p{color:#94a3b8;font-size:15px;font-weight:700;line-height:1.9}
button{margin-top:22px;width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#022c14;font:inherit;font-size:17px;font-weight:900;cursor:pointer}
small{display:block;margin-top:14px;color:#64748b;font-size:12.5px;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div class="ic">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذّر فتح النظام لأن الهاتف غير متصل بالإنترنت.<br>تأكد من الواي فاي أو بيانات الهاتف ثم حاول مرة أخرى.</p>
  <button type="button" onclick="location.reload()">🔄 إعادة المحاولة</button>
  <small>تُفتح الصفحة تلقائياً عند عودة الاتصال</small>
</div>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
